# CI runs what `make check` runs, then the fuzzers briefly and the budgets (make bench). GitHub
# Actions reads only YAML; nothing else in the project is configured in it. TOLERANCE=1.5: the
# engine's speed budgets are calibrated to the runner, and the calibration can be that far out on
# a machine other than the budgets' own (kb/measurements.md).
name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"
      - run: uv python install 3.13
      # The runner's rustup installs the engine's pinned toolchain (engine/rust-toolchain.toml).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: make check (gofmt, ruff format, go vet, golangci-lint, ruff, mypy, the engine's rustfmt, clippy and tests, go test -race, pytest)
        run: make check TOLERANCE=1.5
      - name: make fuzz
        run: make fuzz FUZZTIME=20s
      - name: make bench (the budgets)
        run: make bench TOLERANCE=1.5
      - name: make bench-full (the engine's budgets at the spec's scale, about 3.5 GB)
        run: make bench-full TOLERANCE=1.5

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - run: make build
      - name: make e2e-docker (a server, a worker, and a run in a box)
        run: make e2e-docker
