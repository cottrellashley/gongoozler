[project]
name = "gongoozler"
version = "0.1.0"
description = "Run a backtest file here or in a box, and watch it run: progress events, feed streams, a Nautilus driver, and a fixed income engine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
nautilus = ["nautilus_trader>=2.0.0rc8; python_version >= '3.13'"]
fi = ["fi-engine>=0.1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "nautilus_trader==2.0.0rc8; python_version >= '3.13'",
    "numpy>=2",
    "fi-engine",
]

[tool.uv.sources]
fi-engine = { path = "../engine", editable = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
exclude-newer = "2026-11-01T00:00:00Z"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "BLE"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # counted complexity: judged in review instead
    "PLW0603",  # module state set once per process (the emitter, the artifacts directory)
    "PLC0415",  # Nautilus and numpy are imported where they are needed: importing gongoozler needs neither
    "RUF001", "RUF002", "RUF003",  # typographic characters in prose and status lines are meant
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["nautilus_trader.*", "numpy.*", "fi_engine.*", "polars.*"]
ignore_missing_imports = true
